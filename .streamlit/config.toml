[theme]
base = "light"
primaryColor = "#14305c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 1000
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
